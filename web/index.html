<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Habit Quest - Help kids build healthy digital habits">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- PWA: installable on iPad/iPhone home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habit Quest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme color for browser address bar -->
  <meta name="theme-color" content="#7C4DFF">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Habit Quest</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading spinner while Flutter initializes */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #F5F0FF;
      flex-direction: column;
      font-family: 'Segoe UI', sans-serif;
    }
    .loading p {
      color: #7C4DFF;
      font-size: 18px;
      margin-top: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #E0D4FF;
      border-top: 4px solid #7C4DFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Loading Habit Quest...</p>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
